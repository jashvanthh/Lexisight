# ════════════════════════════════════════════════════════════════
# LexiSight — Confirmed Training Parameters (paper-v1)
# ════════════════════════════════════════════════════════════════
# Values marked CONFIRMED were read directly from training logs.
# Values marked UNCONFIRMED are best estimates — do not cite them
# in the paper without checking the actual training script output.

temporal:
  # ── Architecture ─────────────────────────────────────────────
  input_frames: 30          # CONFIRMED — 1 second at 30 fps
  features: 126             # CONFIRMED — 21 landmarks × 3 coords × 2 hands
  d_model: 128              # CONFIRMED — projection dimension
  heads: 4                  # CONFIRMED — attention heads
  blocks: 2                 # CONFIRMED — transformer layers (paper-v1 model)
                            #   NOTE: holistic_v3 uses 3 blocks — different model
  feedforward_dim: 256      # CONFIRMED
  dropout: 0.2              # CONFIRMED
  classifier_hidden: 64     # CONFIRMED

  # ── Training — Phase 1 ───────────────────────────────────────
  optimizer: adamw          # CONFIRMED
  lr: 0.001                 # CONFIRMED
  weight_decay: 0.01        # UNCONFIRMED — check train_holistic_v2.py
  batch_size: 64            # CONFIRMED
  epochs: 100               # CONFIRMED
  warmup_epochs: 5          # UNCONFIRMED — check train_holistic_v2.py
  label_smoothing: 0.1      # UNCONFIRMED — check train_holistic_v2.py
  early_stopping_patience: 20  # UNCONFIRMED — check train_holistic_v2.py

  # ── Training — Phase 2 (fine-tune) ──────────────────────────
  phase2_lr: 0.0001         # CONFIRMED
  phase2_epochs: 50         # CONFIRMED
  phase2_batch_size: 32     # CONFIRMED

  # ── Data ─────────────────────────────────────────────────────
  split_strategy: stratified_random   # CONFIRMED (NOT signer-disjoint for paper-v1)
  val_ratio: 0.20                     # CONFIRMED — 80/20 split
  seed: 42                            # CONFIRMED
  num_classes: 263                    # CONFIRMED

# ════════════════════════════════════════════════════════════════
# holistic_v3 — Later experiment (NOT the paper model)
# Included for reference / future work
# ════════════════════════════════════════════════════════════════
holistic_v3:
  # ── Architecture (hard-negative mining variant) ──────────────
  input_dim: 126            # CONFIRMED
  num_classes: 263          # CONFIRMED
  hidden_dim: 256           # UNCONFIRMED
  heads: 8                  # CONFIRMED
  blocks: 3                 # CONFIRMED — this is why blocks=3 was confused with paper model
  dropout: 0.30             # UNCONFIRMED
  l2_reg: 0.002             # UNCONFIRMED

  # ── Training ─────────────────────────────────────────────────
  optimizer: adamw          # CONFIRMED
  lr: 0.001                 # CONFIRMED
  batch_size: 32            # UNCONFIRMED
  epochs: 60                # CONFIRMED
  warmup_epochs: 3          # UNCONFIRMED
  label_smoothing: 0.05     # UNCONFIRMED
  focal_gamma: 1.5          # UNCONFIRMED
  seed: 42                  # CONFIRMED
  split_strategy: signer_disjoint  # CONFIRMED — fairer evaluation
