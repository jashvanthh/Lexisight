# LexiSight -- DVC Pipeline Definition
# All paths are relative to the repo root (wdir: .. from ml/).
# Run from repo root: dvc repro ml/dvc.yaml
# DVC only re-runs stages whose inputs (code, data, params) changed.

stages:
  train_temporal:
    cmd: python ml/scripts/train_holistic.py --config ml/configs/train_temporal.yaml
    wdir: .
    deps:
      - ml/configs/train_temporal.yaml
      - ml/scripts/train_holistic.py
    params:
      - ml/params.yaml:
          - temporal
    outs:
      - ml/models/best_temporal.keras
    metrics:
      - ml/eval/temporal_metrics.json:
          cache: false

  train_holistic_v3:
    cmd: python ml/scripts/train_holistic.py --config ml/configs/train_holistic_v3.yaml --hard-neg-mining
    wdir: .
    deps:
      - ml/configs/train_holistic_v3.yaml
      - ml/scripts/train_holistic.py
    params:
      - ml/params.yaml:
          - holistic_v3
    metrics:
      - ml/eval/holistic_v3_metrics.json:
          cache: false
