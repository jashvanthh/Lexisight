name: LexiSight CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:

  # Job 1: Build
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (Vite)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: npx vite build --mode production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Job 2: Unit Tests
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        # Use the locally installed vitest (from node_modules), NOT npx which
        # downloads the latest version (currently v5, breaking API changes from v2).
        run: ./node_modules/.bin/vitest run --reporter=verbose

  # Job 3: Model Regression Test
  model-regression:
    name: Model Regression Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install onnxruntime numpy

      - name: Run model regression test
        # Uses the real public/model/static.onnx (committed to Git) and the
        # validation-split fixture in scripts/fixtures/. Fails if either is missing.
        run: python scripts/model_regression_test.py

  # Job 4: CI Gate
  ci-gate:
    name: CI Gate
    needs: [build, unit-tests, model-regression]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build.result }}" == "success" && \
                "${{ needs.unit-tests.result }}" == "success" && \
                "${{ needs.model-regression.result }}" == "success" ]]; then
            echo "All required CI checks passed."
          else
            echo "One or more required checks failed."
            echo "  build:            ${{ needs.build.result }}"
            echo "  unit-tests:       ${{ needs.unit-tests.result }}"
            echo "  model-regression: ${{ needs.model-regression.result }}"
            exit 1
          fi
