name: LexiSight CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:

  # Job 1: Build
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (Vite)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: npx vite build --mode production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Job 2: Unit Tests
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        # Use the locally installed vitest (from node_modules), NOT npx which
        # downloads the latest version (currently v5, breaking API changes from v2).
        run: ./node_modules/.bin/vitest run --reporter=verbose

  # Job 3: Model Regression Test
  model-regression:
    name: Model Regression Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install onnxruntime numpy

      - name: Run model regression test
        # Uses the real public/model/static.onnx (committed to Git) and the
        # validation-split fixture in scripts/fixtures/. Fails if either is missing.
        run: python scripts/model_regression_test.py

  # Job 4: E2E Smoke Tests (Playwright)
  e2e:
    name: E2E Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Vite dev server
        # Start Vite as a background process with the real secrets so
        # main.jsx doesn't throw "Missing Publishable Key" on load.
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: |
          npx vite --port 5174 &
          echo "VITE_PID=$!" >> $GITHUB_ENV
          # Poll until Vite responds (up to 60s)
          for i in $(seq 1 60); do
            curl -sf http://localhost:5174 > /dev/null && echo "Vite ready after ${i}s" && break
            sleep 1
          done

      - name: Run E2E smoke tests
        run: npx playwright test

      - name: Stop Vite dev server
        if: always()
        run: kill $VITE_PID || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Job 5: CI Gate
  ci-gate:
    name: CI Gate
    needs: [build, unit-tests, model-regression, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build.result }}" == "success" && \
                "${{ needs.unit-tests.result }}" == "success" && \
                "${{ needs.model-regression.result }}" == "success" && \
                "${{ needs.e2e.result }}" == "success" ]]; then
            echo "All required CI checks passed."
          else
            echo "One or more required checks failed."
            echo "  build:            ${{ needs.build.result }}"
            echo "  unit-tests:       ${{ needs.unit-tests.result }}"
            echo "  model-regression: ${{ needs.model-regression.result }}"
            echo "  e2e:              ${{ needs.e2e.result }}"
            exit 1
          fi
